# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
#
# Quartz v5 site configuration.
# Only site-level settings and plugin wiring live here; there is no content data.
# Content only ever exists as org-lite documents under org/.
#
# TODO(wallyhao): replace pageTitle, baseUrl and the footer links.

configuration:
  # Site title, shown in the top-left corner and in <title>
  pageTitle: Wally
  pageTitleSuffix: ""

  # Navigate between pages without a full reload (client-side routing)
  enableSPA: true
  # Show a preview card when hovering internal links
  enablePopovers: true

  # No analytics; switch to { provider: plausible } and friends to enable
  analytics: null

  # UI locale (date formats, search box copy). zh-CN, zh-TW, en-US, ...
  locale: zh-CN

  # Used for RSS, sitemap and canonical URLs; no protocol, no trailing slash
  baseUrl: wallyhao.github.io

  # These directories and files are never published
  ignorePatterns:
    - private
    - drafts
    - templates
    - .obsidian

  theme:
    # Fonts are self-hosted in quartz/static/fonts/lxgw-wenkai/, not loaded from Google Fonts
    fontOrigin: local
    cdnCaching: false
    typography:
      header: LXGW WenKai Screen
      body: LXGW WenKai Screen
      code: IBM Plex Mono
    # Inkstone palette: light = Xuanzhi Dimmed, dark = Xuanmo Dimmed
    colors:
      lightMode:
        light: "#e9e2d4"
        lightgray: "#ded4c2"
        gray: "#847c6e"
        darkgray: "#4f4a40"
        dark: "#2f2b25"
        secondary: "#144a74"
        tertiary: "#894e54"
        highlight: rgba(211, 199, 174, 0.45)
        textHighlight: "#d3c7aecc"
      darkMode:
        light: "#19181e"
        lightgray: "#2a2832"
        gray: "#8f8996"
        darkgray: "#b0a99f"
        dark: "#d8d2c6"
        secondary: "#66a9c9"
        tertiary: "#c57f73"
        highlight: rgba(54, 51, 71, 0.55)
        textHighlight: "#c57f7344"

# ---------------------------------------------------------------------------
# Plugin pipeline: transformers -> filters -> emitters -> pageTypes.
# Each entry is one plugin instance, not data.
#   source: npm package name / github:user/repo / a local ./directory
#   order:  execution order within a category; plugin dependencies rely on it
#   layout: component-only plugins only; declares the layout slot to render into
# ---------------------------------------------------------------------------
plugins:
  # --- transformers: per-document Markdown/HTML transforms -------------------
  # Pin the first-visit theme to light instead of following the OS preference
  - source: ./plugins/default-theme
    enabled: true
    order: 1

  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: rose-pine-dawn
        dark: rose-pine-moon
      keepBackground: false
    order: 20

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30

  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40

  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30

  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  - source: "@quartz-community/description"
    enabled: true
    order: 70

  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: "@quartz-community/citations"
    enabled: false
    order: 85

  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90

  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91

  - source: "@quartz-community/roam"
    enabled: false
    order: 92

  # Local plugin example: derive a reading time from the body and render it above the article
  - source: ./plugins/reading-time
    enabled: true
    order: 75

  # --- Frontend assets / fonts ---------------------------------------------
  # Disabled: it ships its own header/body/code defaults (Schibsted Grotesk /
  # Source Sans Pro), ignores configuration.theme.typography, injects
  # h1..h6 font-family rules and adds a Google Fonts link to <head>.
  # Fonts here are self-hosted, so it is not needed.
  - source: "@quartz-community/quartz-fonts"
    enabled: false

  # Layout comes from ink-paper; colors and fonts are overridden in quartz/styles/custom.scss
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: "ink-paper"
      mode: both
      themeFonts: false

  # --- filters: decide which documents are published ------------------------
  - source: "@quartz-community/remove-draft"
    enabled: true

  - source: "@quartz-community/explicit-publish"
    enabled: false

  # --- emitters: emit artifacts other than HTML -----------------------------
  - source: "@quartz-community/alias-redirects"
    enabled: true

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  - source: "@quartz-community/favicon"
    enabled: true

  # Disabled: OG images download fonts from Google Fonts, which cannot resolve
  # the self-hosted LXGW WenKai. Re-enable together with a Google font if social
  # cards are needed.
  - source: "@quartz-community/og-image"
    enabled: false

  # Disabled: it would write a CNAME file holding the default *.github.io domain
  - source: "@quartz-community/cname"
    enabled: false

  # --- pageTypes: decide how a class of pages renders -----------------------
  - source: "@quartz-community/canvas-page"
    enabled: false

  - source: "@quartz-community/content-page"
    enabled: true

  - source: "@quartz-community/folder-page"
    enabled: true

  - source: "@quartz-community/tag-page"
    enabled: true

  # --- Component-only plugins: drop a piece of UI into the layout -----------
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50

  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10

  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50

  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  - source: "@quartz-community/content-meta"
    enabled: true
    options:
      # Reading time is handled by the local plugin (more accurate for CJK); keep the date only
      showReadingTime: false
    layout:
      position: beforeBody
      priority: 20
      # No date on the home page: it has no article timestamp
      condition: not-index

  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30

  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10

  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10

  - source: "@quartz-community/footer"
    enabled: true
    options:
      # TODO: your own links; leave empty to hide
      links: {}
    layout:
      position: footer
      priority: 50

  # Recent posts list on the home page.
  # Disabled while the site has no posts: with nothing to list it renders an
  # empty "最近更新" heading. Re-enable together with the first post.
  - source: "@quartz-community/recent-notes"
    enabled: false
    options:
      title: 最近更新
      limit: 5
      showTags: true
      linkToMore: posts
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: afterBody
      priority: 50
      # The index condition is registered in quartz.ts
      condition: index

  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only

  - source: "@quartz-community/bases-page"
    enabled: false
    options: {}
    order: 50

  # Required: parses frontmatter. The properties panel is disabled; parsing stays.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5

  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45

  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900

  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all

# ---------------------------------------------------------------------------
# Page skeleton: which components go into which slot, and in what order
# ---------------------------------------------------------------------------
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
